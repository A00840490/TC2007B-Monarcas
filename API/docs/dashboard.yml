tags:
  - Dashboard
summary: Dashboard KPIs
description: >
  Returns the overall money and donor indicators for the dashboard.
  Requires an Admin token in `Authorization: Bearer <token>`.
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Admin role)"
responses:
  200:
    description: Dashboard indicators
    schema:
      type: object
      properties:
        availableMoney:
          type: integer
          example: 25000
        pledgedMoney:
          type: integer
          example: 40000
        activeDonors:
          type: integer
          example: 120
        atRiskDonors:
          type: integer
          example: 15
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not an Admin
  500:
    description: Server or database error
    schema:
      type: object
      properties:
        error:
          type: string
