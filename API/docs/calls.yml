tags:
  - Telefonistas
summary: Calls of the telefonista's shift
description: >
  The logged-in telefonista's calls for today. `state` groups them for the
  queue: Terminada (has a result), Vencida (PENDING and its time already
  passed) or Próxima (PENDING, still to come).
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Telefonista role). The user is taken from the token."
responses:
  200:
    description: List of calls with the donor's information
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          time:
            type: string
            example: "2026-10-18 10:30:00"
          hour:
            type: string
            example: "10:30"
          status:
            type: string
            enum: ["PENDING", "NO_ANSWER", "DECLINED", "ACCEPTED", "RESCHEDULED"]
            example: "PENDING"
          state:
            type: string
            enum: ["Vencida", "Próxima", "Terminada"]
            example: "Próxima"
          result:
            type: string
            description: Result in Spanish; empty while PENDING
            example: ""
          goal:
            type: string
            example: "Confirmar renovación de donativo mensual."
          donor:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "Roberto Gómez Fernández"
              nickname:
                type: string
                description: How the donor likes to be called; empty if not registered
                example: "Don Roberto"
              phone:
                type: string
                example: "8122345567"
              campaign:
                type: string
                example: "Padrinazgo mensual"
              risk:
                type: string
                enum: ["LOW", "MEDIUM", "HIGH"]
                example: "MEDIUM"
              pledge:
                type: number
                description: Monthly amount of the ACTIVE pledge; 0 if there is none
                example: 300
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not a telefonista
  500:
    description: Server or database error
