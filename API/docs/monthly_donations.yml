Gets donations grouped by month
---
tags:
  - Dashboard
summary: Donation totals per month
description: Returns the total money collected per month to feed the dashboard chart.
responses:
  200:
    description: Donations per month
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
            description: Month number (1 for January, 2 for February, etc.).
          month:
            type: string
            example: "January"
            description: Month name, as returned by SQL Server's DATENAME.
          amount:
            type: integer
            example: 15000
            description: Total collected that month.
  500:
    description: Server or database error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Server or database error: Connection timeout"
