Gets donations grouped by month
---
tags:
  - Dashboard
summary: Donation totals per month
description: >
  Returns the total money collected per month to feed the dashboard chart.
  Requires an Admin token in `Authorization: Bearer <token>`.
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Admin role)"
responses:
  200:
    description: Donations per month
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
            description: Month number (1 for January, 2 for February, etc.).
          month:
            type: string
            example: "January"
            description: Month name, as returned by SQL Server's DATENAME.
          amount:
            type: integer
            example: 15000
            description: Total collected that month.
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not an Admin
  500:
    description: Server or database error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Server or database error: Connection timeout"
