tags:
  - Donors
summary: Schedule a call
description: >
  Creates a REGULAR, PENDING PhoneCall for a donor, assigned to a
  telefonista. It shows up in the Telefonista app on that day.
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Admin role)"
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [donorId, telefonistaId, scheduledDate]
      properties:
        donorId:
          type: integer
          example: 3
        telefonistaId:
          type: integer
          description: Must be a user with the Telefonista role
          example: 2
        scheduledDate:
          type: string
          description: Local date and time, today or later
          example: "2026-10-12T10:00:00"
        notes:
          type: string
          maxLength: 1000
          description: Goal of the call, shown to the telefonista
          example: Invitar a la campaña de invierno
responses:
  201:
    description: The scheduled call
    schema:
      type: object
      properties:
        id:
          type: integer
        donorId:
          type: integer
        telefonistaId:
          type: integer
        type:
          type: string
          example: REGULAR
        status:
          type: string
          example: PENDING
        scheduledDate:
          type: string
          example: "2026-10-12T10:00:00"
        notes:
          type: string
  400:
    description: Invalid data, a date in the past, a donor that does not exist or a user who is not a telefonista
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not an Admin
  500:
    description: Server or database error
