<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API TC2007B - Swagger</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css" integrity="sha384-Ov4/wv3j2bmct8cDc5X4ngJZohVPzEmc6uDPH8WeljUxO5vtoykvMEfbu9Vh6RaW" crossorigin="anonymous">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js" integrity="sha384-ZPehFMQommnnuaZ4rpxgkgTT2DKFVp4hZC/7pLit+9Lek9T1YGSo23eHFbvNkXkw" crossorigin="anonymous"></script>
<script>
SwaggerUIBundle({ spec: {
 "info": {
  "title": "API TC2007B",
  "description": "REST API para la materia TC2007B (vista local de la documentación, sin base de datos)",
  "version": "1.0.0"
 },
 "paths": {
  "/api/hello": {
   "get": {
    "summary": "Keepalive",
    "description": "Returns the plain text \"Shakira rocks!\" so a monitor can check that the API is up. It does not need a token or the database.\n",
    "responses": {
     "200": {
      "description": "A successful response is \"Shakira rocks!\""
     }
    },
    "tags": [
     "General"
    ],
    "produces": [
     "text/plain"
    ]
   }
  },
  "/api/login/attempt": {
   "post": {
    "summary": "Validates credentials and returns a JSON Web Token",
    "description": "If `role` is sent, only a user with that role is accepted (Role table, Name column). The token is then used in `POST /login/verify` or in the `Authorization: Bearer <token>` header of protected endpoints.\n",
    "responses": {
     "200": {
      "description": "Successful authentication",
      "schema": {
       "properties": {
        "token": {
         "type": "string",
         "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        },
        "userId": {
         "type": "integer",
         "example": 3
        },
        "role": {
         "type": "string",
         "example": "Admin"
        }
       }
      }
     },
     "400": {
      "description": "Body is not a JSON object, missing email or password, password is not a 64-character hex SHA-256, or unknown role"
     },
     "401": {
      "description": "Invalid credentials"
     },
     "403": {
      "description": "The user does not have the requested role"
     },
     "429": {
      "description": "More than 5 attempts per minute from the same IP"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "body",
      "name": "body",
      "required": true,
      "schema": {
       "type": "object",
       "required": [
        "email",
        "password"
       ],
       "properties": {
        "email": {
         "type": "string",
         "format": "email",
         "example": "admin@caritas.org.mx"
        },
        "password": {
         "type": "string",
         "format": "password",
         "description": "Hex SHA-256 of the password",
         "example": "7b85175b455060e3237e925f023053ca95..."
        },
        "role": {
         "type": "string",
         "enum": [
          "Recolector",
          "Telefonista",
          "Admin"
         ],
         "example": "Admin"
        }
       }
      }
     }
    ],
    "tags": [
     "Authentication"
    ]
   }
  },
  "/api/login/verify": {
   "post": {
    "summary": "Verifies a JSON Web Token against a role",
    "description": "Returns 200 only if the token is valid and not expired, the user still exists in the database and their current role matches `role`. The token can go in the body or in `Authorization: Bearer <token>`.\n",
    "responses": {
     "200": {
      "description": "Token is valid for that role",
      "schema": {
       "properties": {
        "valid": {
         "type": "boolean",
         "example": true
        },
        "userId": {
         "type": "integer",
         "example": 3
        },
        "role": {
         "type": "string",
         "example": "Admin"
        }
       }
      }
     },
     "400": {
      "description": "Body is not a JSON object, missing token or role, or unknown role"
     },
     "401": {
      "description": "Invalid or expired token, or the user no longer exists"
     },
     "403": {
      "description": "The user does not have that role"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "body",
      "name": "body",
      "required": true,
      "schema": {
       "type": "object",
       "required": [
        "role"
       ],
       "properties": {
        "token": {
         "type": "string",
         "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        },
        "role": {
         "type": "string",
         "enum": [
          "Recolector",
          "Telefonista",
          "Admin"
         ],
         "example": "Admin"
        }
       }
      }
     }
    ],
    "tags": [
     "Authentication"
    ]
   }
  },
  "/api/recolectores/route": {
   "get": {
    "summary": "A recolector's route for one day",
    "description": "Returns the collections assigned to the logged-in recolector on the given date, sorted by `order` (those without an order go last). Used by the \"Ruta del día\" screen. Each collection includes its `status` and, when it was SUCCESSFUL, the amount received.\n",
    "responses": {
     "200": {
      "description": "The day's collections (may be empty)",
      "schema": {
       "type": "array",
       "items": {
        "type": "object",
        "properties": {
         "id": {
          "type": "integer",
          "example": 1
         },
         "scheduledDate": {
          "type": "string",
          "example": "2026-10-16T09:00:00"
         },
         "expectedAmount": {
          "type": "number",
          "example": 500.0
         },
         "order": {
          "type": "integer",
          "example": 1
         },
         "status": {
          "type": "string",
          "enum": [
           "PENDING",
           "SUCCESSFUL",
           "FAILED"
          ],
          "example": "PENDING"
         },
         "receivedAmount": {
          "type": "number",
          "description": "Amount received when the collection is SUCCESSFUL; null otherwise",
          "example": null
         },
         "notes": {
          "type": "string",
          "description": "Reason registered when the collection FAILED",
          "example": null
         },
         "donorName": {
          "type": "string",
          "example": "Don Roberto Garza Sada"
         },
         "address": {
          "type": "string",
          "description": "The donor's address; an empty string when the donor has none",
          "example": "Av. Constitución 100, Monterrey"
         }
        }
       }
      }
     },
     "400": {
      "description": "Missing date, or it is not in YYYY-MM-DD format"
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a recolector"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Recolector role). The user is taken from the token."
     },
     {
      "in": "query",
      "name": "date",
      "type": "string",
      "format": "date",
      "required": true,
      "example": "2026-10-16"
     }
    ],
    "tags": [
     "Recolectores"
    ]
   }
  },
  "/api/recolectores/result": {
   "post": {
    "summary": "Registers the result of a collection",
    "description": "The logged-in recolector closes one of their PENDING collections as SUCCESSFUL (with the amount received) or FAILED (with the reason). A SUCCESSFUL collection also creates its cash Donation, so it shows up in the donor's history; the result and the Donation are saved in one transaction, so either both are saved or neither is. Used by the \"Registrar resultado\" screen, opened from a card of the Ruta del día.\n",
    "responses": {
     "200": {
      "description": "Result saved",
      "schema": {
       "type": "object",
       "properties": {
        "id": {
         "type": "integer",
         "example": 1
        },
        "status": {
         "type": "string",
         "example": "SUCCESSFUL"
        },
        "receivedAmount": {
         "type": "number",
         "example": 2500.0
        },
        "notes": {
         "type": "string",
         "example": null
        }
       }
      }
     },
     "400": {
      "description": "Missing or invalid fields (amount <= 0, empty or too long notes, unknown status)"
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a recolector, or the collection is assigned to someone else"
     },
     "404": {
      "description": "The collection does not exist"
     },
     "409": {
      "description": "The collection already has a result"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Recolector role)."
     },
     {
      "in": "body",
      "name": "body",
      "required": true,
      "schema": {
       "type": "object",
       "required": [
        "collectionId",
        "status"
       ],
       "properties": {
        "collectionId": {
         "type": "integer",
         "example": 1
        },
        "status": {
         "type": "string",
         "enum": [
          "SUCCESSFUL",
          "FAILED"
         ],
         "example": "SUCCESSFUL"
        },
        "receivedAmount": {
         "type": "number",
         "description": "Required when status is SUCCESSFUL. Greater than 0.",
         "example": 2500
        },
        "notes": {
         "type": "string",
         "description": "Required when status is FAILED (the reason). At most 1000 characters.",
         "example": "No había nadie en el domicilio"
        }
       }
      }
     }
    ],
    "tags": [
     "Recolectores"
    ]
   }
  },
  "/api/recolectores/reschedule": {
   "put": {
    "summary": "Reschedules a FAILED collection to another date",
    "description": "The logged-in recolector puts one of their FAILED collections back to PENDING on a new date (same time of day as the original visit). Its route order is cleared and its notes (the failure reason) are kept. Used by the \"Reprogramar visita\" button of the \"Registrar resultado\" screen.\n",
    "responses": {
     "200": {
      "description": "Collection rescheduled",
      "schema": {
       "type": "object",
       "properties": {
        "id": {
         "type": "integer",
         "example": 13
        },
        "status": {
         "type": "string",
         "example": "PENDING"
        },
        "scheduledDate": {
         "type": "string",
         "example": "2026-10-22T13:45:00"
        }
       }
      }
     },
     "400": {
      "description": "Missing or invalid fields, or newDate is not after today"
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a recolector, or the collection is assigned to someone else"
     },
     "404": {
      "description": "The collection does not exist"
     },
     "409": {
      "description": "The collection is not FAILED (only a FAILED collection can be rescheduled)"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Recolector role)."
     },
     {
      "in": "body",
      "name": "body",
      "required": true,
      "schema": {
       "type": "object",
       "required": [
        "collectionId",
        "newDate"
       ],
       "properties": {
        "collectionId": {
         "type": "integer",
         "example": 13
        },
        "newDate": {
         "type": "string",
         "format": "date",
         "description": "YYYY-MM-DD, after today",
         "example": "2026-10-22"
        }
       }
      }
     }
    ],
    "tags": [
     "Recolectores"
    ]
   }
  },
  "/api/recolectores/history": {
   "get": {
    "summary": "Latest donations of the donor of a collection",
    "description": "Returns the donor's last 10 donations, newest first. The donor is the one of the given collection, which must be assigned to the logged-in recolector. Used by the \"Últimas donaciones del donante\" section of the \"Registrar resultado\" screen.\n",
    "responses": {
     "200": {
      "description": "The donor's donations (empty list if there are none)",
      "schema": {
       "type": "array",
       "items": {
        "type": "object",
        "properties": {
         "id": {
          "type": "integer",
          "example": 31
         },
         "donationDate": {
          "type": "string",
          "example": "2026-09-15T10:30:00"
         },
         "totalAmount": {
          "type": "number",
          "example": 2500.0
         },
         "paymentMethod": {
          "type": "string",
          "enum": [
           "CASH",
           "TRANSFER"
          ],
          "example": "CASH"
         }
        }
       }
      }
     },
     "400": {
      "description": "Missing or invalid collectionId"
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a recolector, or the collection is assigned to someone else"
     },
     "404": {
      "description": "The collection does not exist"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Recolector role)."
     },
     {
      "in": "query",
      "name": "collectionId",
      "type": "integer",
      "required": true,
      "example": 10
     }
    ],
    "tags": [
     "Recolectores"
    ]
   }
  },
  "/api/recolectores/summary": {
   "get": {
    "summary": "Summary of the logged-in recolector's day",
    "description": "Counts the recolector's collections of the given date by status and adds up the expected and the received amounts. The received amount is the sum of the donations of the SUCCESSFUL collections (their ExpectedAmount if a collection has no donation yet). Used by the summary card of the \"Ruta del día\" screen.\n",
    "responses": {
     "200": {
      "description": "The day's summary (all zeros if there are no collections)",
      "schema": {
       "type": "object",
       "properties": {
        "date": {
         "type": "string",
         "example": "2026-10-16"
        },
        "totalVisits": {
         "type": "integer",
         "example": 3
        },
        "successful": {
         "type": "integer",
         "example": 1
        },
        "failed": {
         "type": "integer",
         "example": 1
        },
        "pending": {
         "type": "integer",
         "example": 1
        },
        "expectedAmount": {
         "type": "number",
         "example": 1800.0
        },
        "receivedAmount": {
         "type": "number",
         "example": 790.5
        }
       }
      }
     },
     "400": {
      "description": "Missing date, or it is not in YYYY-MM-DD format"
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a recolector"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Recolector role). The user is taken from the token."
     },
     {
      "in": "query",
      "name": "date",
      "type": "string",
      "format": "date",
      "required": true,
      "example": "2026-10-16"
     }
    ],
    "tags": [
     "Recolectores"
    ]
   }
  },
  "/api/telefonistas/calls": {
   "get": {
    "summary": "Calls of the telefonista's shift",
    "description": "The logged-in telefonista's calls for today. `state` groups them for the queue: Terminada (has a result), Vencida (PENDING and its time already passed) or Próxima (PENDING, still to come).\n",
    "responses": {
     "200": {
      "description": "List of calls with the donor's information",
      "schema": {
       "type": "array",
       "items": {
        "type": "object",
        "properties": {
         "id": {
          "type": "integer",
          "example": 1
         },
         "time": {
          "type": "string",
          "example": "2026-10-18 10:30:00"
         },
         "hour": {
          "type": "string",
          "example": "10:30"
         },
         "status": {
          "type": "string",
          "enum": [
           "PENDING",
           "NO_ANSWER",
           "DECLINED",
           "ACCEPTED",
           "RESCHEDULED"
          ],
          "example": "PENDING"
         },
         "state": {
          "type": "string",
          "enum": [
           "Vencida",
           "Próxima",
           "Terminada"
          ],
          "example": "Próxima"
         },
         "result": {
          "type": "string",
          "description": "Result in Spanish; empty while PENDING",
          "example": ""
         },
         "goal": {
          "type": "string",
          "example": "Confirmar renovación de donativo mensual."
         },
         "donor": {
          "type": "object",
          "properties": {
           "id": {
            "type": "integer",
            "example": 1
           },
           "name": {
            "type": "string",
            "example": "Roberto Gómez Fernández"
           },
           "nickname": {
            "type": "string",
            "description": "How the donor likes to be called; empty if not registered",
            "example": "Don Roberto"
           },
           "phone": {
            "type": "string",
            "example": "8122345567"
           },
           "campaign": {
            "type": "string",
            "example": "Padrinazgo mensual"
           },
           "risk": {
            "type": "string",
            "enum": [
             "LOW",
             "MEDIUM",
             "HIGH"
            ],
            "example": "MEDIUM"
           },
           "pledge": {
            "type": "number",
            "description": "Monthly amount of the ACTIVE pledge; 0 if there is none",
            "example": 300
           }
          }
         }
        }
       }
      }
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a telefonista"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Telefonista role). The user is taken from the token."
     }
    ],
    "tags": [
     "Telefonistas"
    ]
   }
  },
  "/api/telefonistas/donors/{donor_id}": {
   "get": {
    "summary": "Donor detail for the telefonista (HU06)",
    "description": "Contact data, monthly pledge and history (calls and bitácora notes) of a donor. Only answers if the donor has at least one call assigned to the logged-in telefonista; otherwise 403.\n",
    "responses": {
     "200": {
      "description": "The donor's detail",
      "schema": {
       "type": "object",
       "properties": {
        "id": {
         "type": "integer",
         "example": 1
        },
        "name": {
         "type": "string",
         "example": "Roberto Gómez Fernández"
        },
        "nickname": {
         "type": "string",
         "example": "Don Roberto"
        },
        "phone": {
         "type": "string",
         "example": "8122345567"
        },
        "officePhone": {
         "type": "string",
         "example": "8183472036"
        },
        "email": {
         "type": "string",
         "example": "roberto.gomez@gmail.com"
        },
        "address": {
         "type": "string",
         "example": "Av. Eugenio Garza Sada 1200, Col. Altavista, Monterrey, N.L."
        },
        "risk": {
         "type": "string",
         "enum": [
          "LOW",
          "MEDIUM",
          "HIGH"
         ],
         "example": "MEDIUM"
        },
        "campaign": {
         "type": "string",
         "example": "Padrinazgo mensual"
        },
        "pledge": {
         "type": "number",
         "description": "Monthly amount of the ACTIVE pledge; 0 if there is none",
         "example": 300
        },
        "history": {
         "type": "array",
         "description": "Calls with a result and bitácora notes (newest first, at most 20)",
         "items": {
          "type": "object",
          "properties": {
           "id": {
            "type": "string",
            "description": "\"call-<id>\" or \"note-<id>\"",
            "example": "call-12"
           },
           "status": {
            "type": "string",
            "enum": [
             "NO_ANSWER",
             "DECLINED",
             "ACCEPTED",
             "RESCHEDULED",
             "NOTE"
            ],
            "example": "ACCEPTED"
           },
           "result": {
            "type": "string",
            "description": "Aceptó, Rechazó, No contestó, Reagendó or Nota",
            "example": "Aceptó"
           },
           "date": {
            "type": "string",
            "example": "2026-08-02"
           },
           "hour": {
            "type": "string",
            "example": "10:35"
           },
           "notes": {
            "type": "string",
            "example": "Confirmó recolección de $300 MXN el mismo mes."
           },
           "amount": {
            "type": "number",
            "description": "Amount of the collection the call created; 0 if none",
            "example": 300
           }
          }
         }
        }
       }
      }
     },
     "401": {
      "description": "Missing, invalid or expired token"
     },
     "403": {
      "description": "The user is not a telefonista, or the donor is not in their assigned calls"
     },
     "404": {
      "description": "The donor does not exist"
     },
     "500": {
      "description": "Server or database error"
     }
    },
    "parameters": [
     {
      "in": "header",
      "name": "Authorization",
      "type": "string",
      "required": true,
      "description": "Bearer <token> from /api/login/attempt (Telefonista role). The user is taken from the token."
     },
     {
      "in": "path",
      "name": "donor_id",
      "type": "integer",
      "required": true,
      "example": 1
     }
    ],
    "tags": [
     "Telefonistas"
    ]
   }
  },
  "/api/telefonistas/calls/{call_id}/result": {
   "post": {
    "summary": "Save the result of a call (HU07)",
    "description": "Saves the result of a PENDING call of the logged-in telefonista, with the real time of the call and notes. ACCEPTED also creates the PENDING collection for the donor's recolector; RESCHEDULED also creates a new PENDING call on the chosen date. The result shows up in the donor's activity in the admin panel.\n",
    "responses": {
     "200": {
      "description": "The saved result",
      "schema": {
       "type": "object",
       "properties": {
        "id": {
         "type": "integer",
