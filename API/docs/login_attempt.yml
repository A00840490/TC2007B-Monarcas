tags:
  - Authentication
summary: Validates credentials and returns a JSON Web Token
description: >
  If `role` is sent, only a user with that role is accepted (Role table, Name
  column). The token is then used in `POST /login/verify` or in the
  `Authorization: Bearer <token>` header of protected endpoints.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@caritas.org.mx
        password:
          type: string
          format: password
          description: Hex SHA-256 of the password
          example: 7b85175b455060e3237e925f023053ca95...
        role:
          type: string
          enum: [Recolector, Telefonista, Admin]
          example: Admin
responses:
  200:
    description: Successful authentication
    schema:
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        userId:
          type: integer
          example: 3
        role:
          type: string
          example: Admin
  400:
    description: Body is not a JSON object, missing email or password, password is not a 64-character hex SHA-256, or unknown role
  401:
    description: Invalid credentials
  403:
    description: The user does not have the requested role
  429:
    description: More than 5 attempts per minute from the same IP
  500:
    description: Server or database error
