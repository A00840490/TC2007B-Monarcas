tags:
  - Recolectores
summary: A recolector's route for one day
description: >
  Returns the collections assigned to the logged-in recolector on the given date, sorted by
  `order` (those without an order go last). Used by the "Ruta del día" screen. Each collection
  includes its `status` and, when it was SUCCESSFUL, the amount received.
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Recolector role). The user is taken from the token."
  - in: query
    name: date
    type: string
    format: date
    required: true
    example: "2026-10-16"
responses:
  200:
    description: The day's collections (may be empty)
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          scheduledDate:
            type: string
            example: "2026-10-16T09:00:00"
          expectedAmount:
            type: number
            example: 500.0
          order:
            type: integer
            example: 1
          status:
            type: string
            enum: [PENDING, SUCCESSFUL, FAILED]
            example: PENDING
          receivedAmount:
            type: number
            description: Amount received when the collection is SUCCESSFUL; null otherwise
            example: null
          notes:
            type: string
            description: Reason registered when the collection FAILED
            example: null
          donorName:
            type: string
            example: "Don Roberto Garza Sada"
          address:
            type: string
            example: "Av. Constitución 100, Monterrey"
  400:
    description: Missing date, or it is not in YYYY-MM-DD format
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not a recolector
  500:
    description: Server or database error
