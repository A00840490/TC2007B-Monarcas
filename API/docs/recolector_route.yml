tags:
  - Recolectores
summary: A recolector's route for one day
description: Returns the collections assigned to the logged-in recolector on the given date, sorted by `order` (those without an order go last).
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Recolector role). The user is taken from the token."
  - in: query
    name: date
    type: string
    format: date
    required: true
    description: Date in YYYY-MM-DD format
    example: "2026-10-07"
responses:
  200:
    description: The day's collections
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          scheduledDate:
            type: string
            example: "2026-10-07T09:00:00"
          expectedAmount:
            type: number
            example: 500.0
          order:
            type: integer
            example: 1
          donorName:
            type: string
            example: "Don Roberto Garza Sada"
          address:
            type: string
            example: "Av. Constitución 100, Monterrey"
  400:
    description: Missing date, or it is not in YYYY-MM-DD format
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not a recolector
  500:
    description: Server or database error
