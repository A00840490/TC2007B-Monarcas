tags:
  - Donors
summary: Schedule a collection
description: >
  Creates a PENDING Collection for a donor, assigned to a recolector. It
  shows up in that day's route of the Recolector app, after the visits that
  already have an order.
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: "Bearer <token> from /api/login/attempt (Admin role)"
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [donorId, recolectorId, scheduledDate]
      properties:
        donorId:
          type: integer
          example: 3
        recolectorId:
          type: integer
          description: Must be a user with the Recolector role
          example: 3
        scheduledDate:
          type: string
          description: Local date and time, today or later
          example: "2026-10-12T11:00:00"
        expectedAmount:
          type: number
          example: 800
        notes:
          type: string
          maxLength: 1000
          example: Tocar en la puerta de atrás
responses:
  201:
    description: The scheduled collection
    schema:
      type: object
      properties:
        id:
          type: integer
        donorId:
          type: integer
        recolectorId:
          type: integer
        status:
          type: string
          example: PENDING
        scheduledDate:
          type: string
        expectedAmount:
          type: number
        notes:
          type: string
  400:
    description: Invalid data, a date in the past, a donor that does not exist or a user who is not a recolector
  401:
    description: Missing, invalid or expired token
  403:
    description: The user is not an Admin
  500:
    description: Server or database error
