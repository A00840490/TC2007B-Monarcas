Obtener la lista de llamadas asignadas al turno de la telefonista
---
responses:
  200:
    description: Lista de llamadas con la información del donante
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          hora:
            type: string
            example: "2026-09-23"
          estado:
            type: string
            example: "Confirmada"
          objetivo:
            type: string
            example: "Confirma donativo."
          donante:
            type: object
            properties:
              id:
                type: integer
                example: 1
              nombre:
                type: string
                example: "Don Roberto Garza Sada"
              telefono:
                type: string
                example: "8199000001"
              promesa:
                type: string
                example: "2500.00"
              caso:
                type: string
                example: "Fondo general"
              riesgo:
                type: string
                example: "Bajo"
                enum: ["Bajo", "Medio", "Alto"]
              ultimoContacto:
                type: string
                example: "2026-09-24"
  500:
    description: Error al consultar la base de datos
